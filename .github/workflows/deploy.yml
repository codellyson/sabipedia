name: Validate and deploy

on:
  pull_request:
  push:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: production-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    name: Validate application
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

      - name: Check Cloudflare bundle
        run: npx wrangler deploy --dry-run

  deploy:
    name: Deploy production
    if: github.event_name != 'pull_request'
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: production
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Verify production configuration
        shell: bash
        run: |
          if grep -q '00000000-0000-0000-0000-000000000001' wrangler.jsonc; then
            echo 'Replace the placeholder D1 database ID in wrangler.jsonc before deploying.' >&2
            exit 1
          fi

          if grep -q '"BETTER_AUTH_URL": "http://localhost' wrangler.jsonc; then
            echo 'Set BETTER_AUTH_URL to the production HTTPS origin before deploying.' >&2
            exit 1
          fi

      - name: Build
        run: npm run build

      - name: Apply D1 migrations
        run: npx wrangler d1 migrations apply DB --remote

      - name: Deploy Worker
        run: npx wrangler deploy

      - name: Smoke test production
        env:
          APP_ORIGIN: https://nigeria-knowledge-bank.codellyson.workers.dev
        run: node scripts/smoke-production.mjs
